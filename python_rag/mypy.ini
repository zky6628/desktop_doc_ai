[mypy]
# 静态类型检查基础配置：覆盖 app/ 包，测试目录暂不强制
python_version = 3.12
files = app
mypy_path = .
explicit_package_bases = True
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True

# uuid6 库无类型标注
[mypy-uuid6.*]
ignore_missing_imports = True

# filetype 库无类型标注
[mypy-filetype.*]
ignore_missing_imports = True

# jieba 库无类型标注（纯 Python，仅调用 cut 接口）
[mypy-jieba.*]
ignore_missing_imports = True
